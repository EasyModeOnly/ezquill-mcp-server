name: CI

# Also runs on the local Forgejo (http://192.168.8.122:3000), this repo's
# primary home, from a BYTE-FOR-BYTE copy in .forgejo/workflows/ci.yml (ezQuill
# epic #53). After editing this file, run `scripts/check-forgejo-workflows.sh
# --fix` and commit the copy; the last step fails if they drift. Only workflows
# copied there run on Forgejo, which keeps publish.yml/deploy.yml on GitHub —
# the push mirror. The home runners are host-mode and share one Docker daemon.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci`, not `npm install`: the lockfile is the contract, and a CI run
      # that quietly resolves different versions from the ones tested locally
      # is a CI run that proves less than it appears to.
      - run: npm ci

      - run: npm test

      # The image is part of the deliverable, so a Dockerfile that no longer
      # builds should fail here rather than at deploy time.
      - run: docker build -t ezquill-mcp-server:ci .

      # .forgejo/workflows/ci.yml must stay a byte-for-byte copy of this file
      # (ezQuill epic #53): see the script for why it cannot be a symlink.
      - run: bash scripts/check-forgejo-workflows.sh
